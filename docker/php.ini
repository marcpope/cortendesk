; CortenDesk container PHP settings
memory_limit = 256M
; upload_max_filesize and post_max_size are written at boot by entrypoint.sh
; (conf.d/zz-cortendesk-uploads.ini), sized from CORTENDESK_DOWNLOADS_MAX_MB.
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
