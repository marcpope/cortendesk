[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
# supervisord exits at start if it cannot get minfds descriptors, and it cannot
# raise the hard limit without CAP_SYS_RESOURCE. So keep this at its default and
# let entrypoint.sh raise the soft limit toward the hard one; every program here
# inherits that.
minfds=1024

# The embedded ID server and relay land here, written by the entrypoint. The
# directory is empty when CORTENDESK_EMBEDDED_SERVER is off.
[include]
files = /etc/supervisor.d/*.conf

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:scheduler]
command=php /app/artisan schedule:work
directory=/app
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
