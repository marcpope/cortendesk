# Actions are pinned to commit SHAs (tag in the trailing comment); bump by hand.
name: Security scan

# composer audit, npm audit, gitleaks and the image scans fail the build.
# Semgrep only reports: its findings go to the repository's code scanning tab,
# which only people with write access can see.
on:
  push:
    branches: [main, beta]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly, to catch new advisories for locked dependencies
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: composer
      - run: composer audit --locked --no-interaction

  # The web client's dependencies are all dev tooling except four runtime
  # libraries, and the built bundle is committed, so only the lockfile is
  # audited. Moderate and low advisories are left to Dependabot alerts.
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webclient
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1

  # Trivy, pinned by digest (0.76.2). Only HIGH and CRITICAL findings that have
  # a fix fail the job; the Dockerfile's `apk upgrade` normally clears them on
  # the next build.
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t cortendesk:scan .
      - name: Scan the image built from this commit
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 cortendesk:scan

  # The images people run today. A failure here means the tag needs a new
  # release to pick up fixed packages.
  published-image-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [latest, beta]
    steps:
      - name: Scan ghcr.io/${{ github.repository }}:${{ matrix.tag }}
        run: |
          docker pull --quiet "ghcr.io/${{ github.repository }}:${{ matrix.tag }}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "ghcr.io/${{ github.repository }}:${{ matrix.tag }}"

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.180.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # public/rdclient is the esbuild output of webclient/src, which is
      # scanned. public/assets/vendor holds minified third-party libraries.
      - run: >
          semgrep scan
          --config p/php --config p/security-audit --config p/javascript
          --config p/typescript --config p/secrets
          --exclude vendor --exclude node_modules
          --exclude public/rdclient --exclude public/assets/vendor
          --metrics off
          --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
